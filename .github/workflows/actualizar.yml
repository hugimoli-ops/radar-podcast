# Robot que actualiza la web cada 10 minutos y avisa por Telegram.
# En repositorios públicos GitHub Actions es gratis y sin límite de minutos.
name: Actualizar noticias

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]          # también cuando se suben cambios (p. ej. resúmenes nuevos de Claude)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Leer fuentes y avisar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/actualizar.py

      - name: Guardar las noticias nuevas
        run: |
          git config user.name "robot-noticias"
          git config user.email "robot-noticias@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Noticias actualizadas" -q
            git pull --rebase -X theirs -q origin main || true
            git push -q origin HEAD:main
          fi

      - name: Preparar la web
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar la web
        id: despliegue
        uses: actions/deploy-pages@v4
